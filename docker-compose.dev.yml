name: securevault-dev

services:
  # ============================================================
  # SecureVault Backend (FastAPI Python - Development with Hot Reload)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: securevault-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env.docker
        required: false
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - FRONTEND_URL=http://localhost:3000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend:/app
      - backend_uploads_dev:/app/uploads
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================
  # SecureVault Frontend (Next.js - Development with Hot Reload)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 126606573446-arsp6epmi5p91e325oef6l4ktm6asn58.apps.googleusercontent.com
    container_name: securevault-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.docker
        required: false
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=126606573446-arsp6epmi5p91e325oef6l4ktm6asn58.apps.googleusercontent.com
      - WATCHPACK_POLLING=true
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["npm", "run", "dev"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads_dev:
    driver: local
