name: securevault

services:
  # ============================================================
  # SecureVault Backend (FastAPI Python)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securevault-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env.docker
        required: false
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/health/deep')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================
  # SecureVault Background Worker Daemon
  # ============================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securevault-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.daemon"]
    env_file:
      - path: .env.docker
        required: false
      - path: backend/.env
        required: false
      - path: .env
        required: false
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy

  # ============================================================
  # SecureVault Frontend (Next.js)
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: 126606573446-arsp6epmi5p91e325oef6l4ktm6asn58.apps.googleusercontent.com
    container_name: securevault-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.docker
        required: false
      - path: backend/.env
        required: false
      - path: .env
        required: false
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  # ============================================================
  # SecureVault Nginx Ingress Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: securevault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  backend_uploads:
    driver: local
